[package]
name = "synthetic-mcp-server"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8"
rmcp = { version = "3.10", features = ["transport-streamable-http-server"] }
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
rmcp = { version = "3.10", features = ["client", "transport-streamable-http-client-reqwest"] }
tempfile = "3"
tokio = { version = "1", features = ["io-util", "process", "time"] }
